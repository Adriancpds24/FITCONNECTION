name: rms
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2
  google_fonts: ^8.0.2
  firebase_core: ^4.4.0
  flutter_riverpod: ^3.2.1
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  camera: ^0.12.0+1
  video_player: ^2.11.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  audioplayers: ^5.2.1
  flutter_map_marker_cluster: ^8.2.2
  health: ^11.0.0
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_commons: ^0.11.1
  lottie: ^3.3.3
  smooth_page_indicator: ^2.0.1
  qr_flutter: ^4.1.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  socket_io_client: ^3.1.4
  app_links: ^6.4.0
dependency_overrides:
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_1024.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/icons/app_icon_1024.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#000000"
    image: assets/icons/app_icon_1024.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
