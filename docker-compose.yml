services:
  # --- FRONTEND (Flutter Web) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitconnect-frontend
    ports:
      - "${FRONT_PORT:-8081}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fitconnect-network

  # --- BACKEND (Node.js API) ---
  api:
    build:
      context: ./Database/api
      dockerfile: Dockerfile
    container_name: fitconnect-api
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Persist uploaded images (nutrition/social) so they don't disappear on refresh.
      - "./Database/api/uploads:/app/uploads"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-fitconnect_db}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-tuh_clave_secreta_para_fitconnect_2026}
      - NODE_ENV=${NODE_ENV:-development}
      # AI (server-side). Do NOT put API keys in the Flutter client.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_CHAT_MODEL=${GROQ_CHAT_MODEL:-llama-3.1-8b-instant}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-FitConnect}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_RATE_LIMIT_PER_MINUTE=${AI_RATE_LIMIT_PER_MINUTE:-30}
      - AI_IMAGE_RATE_LIMIT_PER_MINUTE=${AI_IMAGE_RATE_LIMIT_PER_MINUTE:-10}
      - AI_FETCH_TIMEOUT_MS=${AI_FETCH_TIMEOUT_MS:-20000}
      - AI_FETCH_RETRIES=${AI_FETCH_RETRIES:-2}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-http://localhost:8081/reset-password}
      - PASSWORD_RESET_APP_URL=${PASSWORD_RESET_APP_URL:-fitconnect://reset-password}
      - PASSWORD_RESET_TOKEN_TTL_MINUTES=${PASSWORD_RESET_TOKEN_TTL_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - fitconnect-network

  # --- DATABASE (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    container_name: fitconnect-db
    environment:
      - POSTGRES_USER=${DB_USER:-user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-fitconnect_db}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-fitconnect_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "./Database/api/base de datos/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql"
      - "./Database/api/base de datos/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql"
    networks:
      - fitconnect-network

networks:
  fitconnect-network:
    driver: bridge

volumes:
  postgres_data:
